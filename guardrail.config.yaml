# FSD layer order, highest to lowest. A layer may only import from a
# layer below it in this list.
layers:
  - app
  - pages
  - widgets
  - features
  - entities
  - shared

# Layers with no real slice boundary — the segment right under "shared" is
# a technical category (ui, lib, api, config), not a business-domain slice,
# so same-layer-cross-import and public-api don't apply to it.
sliceLessLayers:
  - shared

rules:
  layer-direction:
    enabled: true
    severity: error
  same-layer-cross-import:
    enabled: true
    severity: error
  public-api:
    enabled: true
    severity: warning
